<!DOCTYPE html>
<head>
	<meta charset="UTF-8">
	<title>The new website of Dr. Cathryn Piwinski, editor</title>
	<meta name="description" content="Mother to Colson, cat"/>
	<meta name="theme-color" content="#1D8F41">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<!-- usefathom.com/ref/VIGUPS -->
	<script src="https://cdn.usefathom.com/script.js" data-site="JNOSVOQE" defer></script>
</head>
<style>
	:root {
		--bleed: 0px;
		--background-y: 0px;
		min-height: 100%;
		padding-block: var(--bleed);
		background: url('./colson.jpg') center var(--background-y) / cover no-repeat;
	}

	body {
		margin: 0;
		min-height: 100vh;
		min-height: 100lvh;
		touch-action: auto;
		overscroll-behavior-y: auto;
		background: transparent;
	}

	@supports (-webkit-touch-callout: none) {
		:root {
			/* Safari 26 can report zero safe-area insets despite visible bars.
			   Keep image content beyond both edges of its layout viewport. */
			--bleed: max(100px, env(safe-area-inset-top), env(safe-area-inset-bottom));
		}
	}
</style>
<body
	role="img"
	aria-label="Colson, tabby cat, fit to his Saint Marks Place IKEA couch armrest"
></body>
<script>
if (CSS.supports('-webkit-touch-callout', 'none')) {
	const root = document.documentElement;
	let anchor = 0;

	// Paint on the document: fixed elements are clipped above Safari's controls.
	// Counter document scrolling without cancelling native touch gestures.
	const positionBackground = () => {
		root.style.setProperty('--background-y', `${scrollY - anchor}px`);
	};
	const centerImage = () => {
		if (visualViewport && visualViewport.scale !== 1) return;
		anchor = parseFloat(getComputedStyle(root).paddingTop);
		scrollTo({ top: anchor, behavior: 'instant' });
		positionBackground();
	};

	addEventListener('scroll', positionBackground, { passive: true });
	addEventListener('scrollend', centerImage);
	addEventListener('resize', centerImage);
	addEventListener('pageshow', centerImage);
	requestAnimationFrame(centerImage);
}
</script>
